server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /dukcapil/ {
        proxy_pass https://172.16.160.177:8000/dukcapil/;
        proxy_set_header Host 172.16.160.177;
        
        # Hapus header yang mengekspos IP asli klien agar server Dukcapil 
        # hanya melihat IP dari server Nginx/Docker ini saja
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        
        proxy_ssl_verify off;
    }
}
