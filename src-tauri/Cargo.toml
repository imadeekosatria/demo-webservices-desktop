[package]
name = "verifikasi-penduduk-desktop"
version = "1.0.1"
description = "Aplikasi versi desktop demo untuk verifikasi data penduduk"
authors = ["imadeekosatria"]
edition = "2021"

[lib]
name = "verifikasi_penduduk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["dangerous-settings"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
